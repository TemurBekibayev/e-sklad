name: sotuvpro_mobile
description: "SotuvPro - Savdo xodimi mobil ilovasi (Android/iOS)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  pdf: ^3.10.8
  printing: ^5.13.0
  flutter_animate: ^4.5.0
  uuid: ^4.3.3
  crypto: ^3.0.3
  http: ^1.2.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sound/
    - assets/icon/
