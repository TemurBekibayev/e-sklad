name: ofitsiyant
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.5+1
  dio: ^5.11.1
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.3.0
  path_provider: ^2.1.2
  cached_network_image: ^3.3.1
  flutter_cache_manager: '>=3.3.1 <3.4.3'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
