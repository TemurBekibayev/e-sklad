server {
    server_name kitchen.getpos.uz;

    root /var/www/kitchen.getpos.uz/dist;
    index index.html;

    # React Frontend SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django Backend API Proxy
    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host getpos.uz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Backend WebSockets Proxy (Daphne/Channels)
    location /ws/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host getpos.uz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/kitchen.getpos.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitchen.getpos.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name kitchen.getpos.uz;
    return 301 https://$host$request_uri;
}
